<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Network Diagnostics</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'docker-blue': '#0db7ed',
                    }
                }
            }
        }
    </script>

    <style>
        /* Terminal scrollbar */
        .terminal-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .terminal-scroll::-webkit-scrollbar-track {
            background: #161b22;
        }
        .terminal-scroll::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        .terminal-scroll::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* Terminal line fade-in */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .terminal-line {
            animation: fadeIn 0.15s ease-out;
        }

        /* Pulse animation for status dot */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Simple Header -->
    <header class="flex-shrink-0 bg-gray-800 border-b border-gray-700 px-4 sm:px-6 py-3 sm:py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
            <div class="min-w-0">
                <h1 class="text-lg sm:text-2xl font-bold text-white truncate">
                    🐳 Docker Network Diagnostics
                </h1>
                <p class="text-xs sm:text-sm text-gray-400 mt-1 hidden sm:block">Interactive network debugging tool</p>
            </div>
            <div class="flex items-center gap-4 flex-shrink-0">
                <div id="connection-status" class="flex items-center gap-2 px-2 sm:px-3 py-1.5 sm:py-2 rounded-lg bg-red-500/10 border border-red-500/20">
                    <span class="w-2 h-2 rounded-full bg-red-500 status-pulse"></span>
                    <span class="text-xs sm:text-sm text-red-300 font-medium hidden sm:inline">Disconnected</span>
                    <span class="text-xs text-red-300 font-medium sm:hidden">●</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Terminal Area -->
    <main class="flex-1 flex flex-col max-w-6xl w-full mx-auto p-4 sm:p-6 gap-4 min-h-0">

        <!-- Terminal Window (Fixed Height) -->
        <div class="bg-gray-800 rounded-lg shadow-2xl border border-gray-700 overflow-hidden flex flex-col" style="height: calc(100vh - 280px); min-height: 400px; max-height: 800px;">
            <!-- Terminal Header -->
            <div class="bg-gray-900 px-4 py-3 border-b border-gray-700 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-3">
                    <div class="flex gap-1.5">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    </div>
                    <span class="text-gray-400 text-sm font-mono">docker-diagnostics:~$</span>
                </div>
                <button
                    onclick="clearTerminal()"
                    class="text-gray-400 hover:text-white text-sm px-3 py-1 rounded hover:bg-gray-700 transition-all">
                    Clear
                </button>
            </div>

            <!-- Terminal Output (Scrollable) -->
            <div id="terminal"
                 class="flex-1 bg-black/80 p-4 sm:p-6 overflow-y-auto font-mono text-sm terminal-scroll min-h-0">
                <div class="text-cyan-400 mb-2">🐳 Docker Network Diagnostic Tool</div>
                <div class="text-gray-500">Connecting to diagnostic service...</div>
            </div>
        </div>

        <!-- Input Area (Fixed Position) -->
        <div class="flex-shrink-0 flex gap-2 sm:gap-3 flex-wrap sm:flex-nowrap">
            <input
                type="text"
                id="userInput"
                placeholder="Type: 1=Diagnostic, 2=Wizard, 3=Monitor, 4=Health, 5=Topology..."
                class="flex-1 min-w-0 bg-gray-800 border border-gray-700 rounded-lg px-3 sm:px-4 py-2 sm:py-3 text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-docker-blue focus:border-transparent transition-all font-mono"
                onkeypress="handleKeyPress(event)"
            >
            <button
                onclick="sendInput()"
                class="px-4 sm:px-6 py-2 sm:py-3 bg-docker-blue hover:bg-blue-600 text-white font-semibold rounded-lg transition-all shadow-lg hover:shadow-xl text-sm whitespace-nowrap">
                Send
            </button>
            <button
                onclick="clearTerminal()"
                class="px-4 sm:px-6 py-2 sm:py-3 bg-gray-700 hover:bg-gray-600 text-white font-semibold rounded-lg transition-all text-sm whitespace-nowrap">
                Clear
            </button>
        </div>

        <!-- Quick Commands (Fixed Position) -->
        <div class="flex-shrink-0 flex gap-2 flex-wrap justify-center sm:justify-start">
            <button onclick="sendCommand('1')" class="px-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 rounded border border-gray-700 transition-all whitespace-nowrap">
                [1] Full Diagnostic
            </button>
            <button onclick="sendCommand('2')" class="px-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 rounded border border-gray-700 transition-all whitespace-nowrap">
                [2] Wizard
            </button>
            <button onclick="sendCommand('3')" class="px-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 rounded border border-gray-700 transition-all whitespace-nowrap">
                [3] Monitor
            </button>
            <button onclick="sendCommand('4')" class="px-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 rounded border border-gray-700 transition-all whitespace-nowrap">
                [4] Health
            </button>
            <button onclick="sendCommand('5')" class="px-3 py-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 rounded border border-gray-700 transition-all whitespace-nowrap">
                [5] Topology
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="flex-shrink-0 border-t border-gray-800 px-4 sm:px-6 py-3 sm:py-4">
        <div class="max-w-6xl mx-auto text-center text-xs sm:text-sm text-gray-500">
            <p class="hidden sm:block">Built for Docker Desktop Product Management Interview</p>
            <p class="mt-1">
                <a href="https://github.com/runLikeAMoose/docker-network-diagnostics"
                   target="_blank"
                   class="text-docker-blue hover:text-blue-400 transition-colors">
                    GitHub
                </a>
            </p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="/static/js/app.js"></script>
</body>
</html>
