<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dockter - Docker Network Diagnostics</title>

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dockter - Docker Network Diagnostics">
    <meta property="og:description" content="Interactive tool to debug Docker networking issues. Real-time diagnostics, network topology visualization, and connection testing.">
    <meta property="og:image" content="/static/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Dockter - Docker Network Diagnostics Tool">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dockter - Docker Network Diagnostics">
    <meta name="twitter:description" content="Interactive tool to debug Docker networking issues. Real-time diagnostics, network topology visualization, and connection testing.">
    <meta name="twitter:image" content="/static/og-image.png">
    <meta name="twitter:image:alt" content="Dockter - Docker Network Diagnostics Tool">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'docker-blue': '#0db7ed',
                    }
                }
            }
        }
    </script>

    <style>
        /* Terminal scrollbar */
        .terminal-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .terminal-scroll::-webkit-scrollbar-track {
            background: #161b22;
        }
        .terminal-scroll::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        .terminal-scroll::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* Terminal line fade-in */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .terminal-line {
            animation: fadeIn 0.15s ease-out;
            white-space: pre;
        }

        /* Pulse animation for status dot */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Responsive terminal font sizing - prevent horizontal scroll */
        @media (max-width: 375px) {
            #terminal {
                font-size: 0.5rem;
                padding: 0.5rem;
                line-height: 1.2;
            }
        }
        @media (min-width: 376px) and (max-width: 640px) {
            #terminal {
                font-size: 0.6rem;
                padding: 0.75rem;
                line-height: 1.3;
            }
        }
        @media (min-width: 641px) and (max-width: 768px) {
            #terminal {
                font-size: 0.75rem;
            }
        }
        @media (min-width: 769px) {
            #terminal {
                font-size: 0.875rem;
            }
        }

        /* Prevent scroll on body - constrain to viewport */
        body {
            max-width: 100vw;
            max-height: 100vh;
        }

        /* Cursor blink animation for terminal input */
        #terminalInput:focus {
            caret-color: #10b981;
        }

        /* Make terminal clickable to focus input */
        #terminal {
            cursor: text;
            scroll-behavior: smooth;
        }

        /* Prevent iOS zoom on input focus - ensure min 16px font size */
        @media (max-width: 640px) {
            #terminalInput {
                font-size: 16px;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- Simple Header -->
    <header class="flex-shrink-0 bg-gray-800 border-b border-gray-700 px-4 sm:px-6 py-3 sm:py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
            <div class="min-w-0">
                <h1 class="text-lg sm:text-2xl font-bold text-white truncate">
                    🐳 Dockter
                </h1>
                <p class="text-xs sm:text-sm text-gray-400 mt-1 hidden sm:block">Docker Network Diagnostics</p>
            </div>
            <div class="flex items-center gap-4 flex-shrink-0">
                <div id="connection-status" class="flex items-center gap-2 px-2 sm:px-3 py-1.5 sm:py-2 rounded-lg bg-red-500/10 border border-red-500/20">
                    <span class="w-2 h-2 rounded-full bg-red-500 status-pulse"></span>
                    <span class="text-xs sm:text-sm text-red-300 font-medium hidden sm:inline">Disconnected</span>
                    <span class="text-xs text-red-300 font-medium sm:hidden">●</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Terminal Area -->
    <main class="flex-1 flex flex-col max-w-6xl w-full mx-auto p-4 sm:p-6 min-h-0 overflow-hidden">

        <!-- Terminal Window (Full Height) -->
        <div class="bg-gray-800 rounded-lg shadow-2xl border border-gray-700 overflow-hidden flex flex-col flex-1 min-h-0">
            <!-- Terminal Header -->
            <div class="bg-gray-900 px-4 py-3 border-b border-gray-700 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-3">
                    <div class="flex gap-1.5">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    </div>
                    <span class="text-gray-400 text-sm font-mono">docker-diagnostics:~$</span>
                </div>
                <button
                    onclick="clearTerminal()"
                    class="text-gray-400 hover:text-white text-sm px-3 py-1 rounded hover:bg-gray-700 transition-all">
                    Clear
                </button>
            </div>

            <!-- Terminal Output (Scrollable) -->
            <div id="terminal"
                 class="flex-1 bg-black/80 p-4 sm:p-6 overflow-y-auto overflow-x-hidden font-mono text-sm terminal-scroll min-h-0"
                 onclick="focusTerminalInput()">
                <div class="text-cyan-400 mb-2">🐳 Docker Network Diagnostic Tool</div>
                <div class="text-gray-500">Connecting to diagnostic service...</div>
            </div>

            <!-- Integrated Terminal Input (always visible, at bottom of terminal) -->
            <form class="flex-shrink-0 bg-black/80 px-4 sm:px-6 py-3 border-t border-gray-700/50 flex items-center gap-2" onsubmit="handleTerminalSubmit(event)">
                <span class="text-green-400 font-mono text-sm">❯</span>
                <input
                    type="text"
                    id="terminalInput"
                    placeholder="Type command (1-5) or 'help'..."
                    class="flex-1 bg-transparent border-none text-white placeholder-gray-600 text-sm focus:outline-none font-mono"
                    inputmode="text"
                    enterkeyhint="send"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                >
                <button type="submit" class="text-green-400 hover:text-green-300 transition-colors sm:hidden" aria-label="Send command">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                    </svg>
                </button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="flex-shrink-0 border-t border-gray-800 px-4 sm:px-6 py-3 sm:py-4">
        <div class="max-w-6xl mx-auto text-center text-xs sm:text-sm text-gray-500">
            <p class="hidden sm:block">Built for Docker Desktop Product Management Interview</p>
            <p class="mt-1">
                <a href="https://github.com/runLikeAMoose/docker-network-diagnostics"
                   target="_blank"
                   class="text-docker-blue hover:text-blue-400 transition-colors">
                    GitHub
                </a>
            </p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="/static/js/app.js"></script>
</body>
</html>
