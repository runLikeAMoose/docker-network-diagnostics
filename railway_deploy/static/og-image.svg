    DOCKTER
  </text>

  <!-- Subtitle -->
  <text x="320" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="32" fill="#94a3b8" text-anchor="start" font-weight="500">
